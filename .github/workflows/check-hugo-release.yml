name: Check Hugo releases

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hugo-release-notification
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check latest stable release
        uses: actions/github-script@v9
        with:
          script: |
            const checkRelease = require('./scripts/check-hugo-release.cjs');
            const { env: { HUGO_VERSION } } = require('./vercel.json');
            await checkRelease({ github, context, core, currentVersion: HUGO_VERSION });
