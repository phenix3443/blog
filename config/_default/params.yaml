version: 1.0.X
description: 记录成长和生活的美好
keywords: [Hugo, Go, 技术博客]
default_theme: auto
fingerprint: sha256
date_format: "2006-01-02"
author_archive: false
disable_theme_inject: true

author:
  name: phenix3443
  link: https://github.com/phenix3443
  avatar: /images/profile.webp

header:
  desktop_mode: sticky
  mobile_mode: auto
  title:
    name: phenix3443

footer:
  enable: true
  since: "2016"
  powered:
    enable: false

home:
  profile:
    enable: true
    avatar_url: /images/profile.webp
    title: phenix3443's blog
    subtitle: Gopher, Full Stack Engineer.
    social: true
    typeit: false
    contribution: true
    fullscreen: true
  posts:
    enable: true
    paginate: 10
    columns: 2

social:
  GitHub: phenix3443
  RSS: true

search:
  enable: true
  type: fuse

toc:
  enable: true
  auto: true
  start_level: 1
  end_level: 4

codeblock:
  copy: true

math:
  enable: false

comment:
  enable: false

share:
  enable: false

reward:
  enable: false
  ways:
    alipay: /images/reward/alipay.webp
    wechatpay: /images/reward/wechat.webp

cookieconsent:
  enable: false

app:
  svg_favicon: /images/logo.webp
  mask_color: ""

summary_plainify: true
contribution:
  enable: true
  max_years: 0

visitor_statistics:
  enable: true
  source: https://cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js

custom_partials:
  profile: [custom/visitor-stats.html]
  footer: [custom/visitor-stats-footer.html]
  assets: [custom/visitor-stats-assets.html]
