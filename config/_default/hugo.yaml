baseURL: https://blog.panghuli.cn/
title: phenix3443's blog
copyright: "Copyright © 2016-{year} phenix3443. All Rights Reserved."
defaultContentLanguage: zh-cn
hasCJKLanguage: true
timeZone: Asia/Shanghai
enableRobotsTXT: true
enableEmoji: true
enableGitInfo: true
mainSections: [posts]

module:
  imports:
    - path: github.com/hugo-fixit/FixIt

taxonomies:
  category: categories
  series: series
  tag: tags

permalinks:
  news: /news/:year/:month/:title/
  blog: /blog/:year/:month/:title/

frontmatter:
  lastmod: [":git", "lastmod", ":fileModTime", ":default"]

outputs:
  home: [HTML, RSS, search, archives]
  page: [HTML, Markdown]
  section: [HTML, RSS]
  taxonomy: [HTML]
  term: [HTML, RSS]

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 1
    endLevel: 4
